spring.application.name=student-management-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/student-management-api}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.open-in-view=false

# JWT / đăng nhập
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
app.cookie.secure=${COOKIE_SECURE:false}

# Tài khoản ADMIN đầu tiên (chỉ tạo khi chưa có ADMIN)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
# Chỉ bật trên database local/demo trước lần Flyway migrate đầu tiên.
spring.flyway.placeholders.sampleDataEnabled=${SAMPLE_DATA_ENABLED:false}
# Frontend origin allowed to send credentialed API requests
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
